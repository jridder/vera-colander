[package]
name = "sievectl"
version = "0.3.0"
edition = "2021"
description = "Cross-platform ManageSieve client and Sieve rule builder"
license = "MIT"

[workspace]
members = ["crates/sieve-rules"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui"]

[[bin]]
name = "sievectl-gui"
path = "src/bin/sievectl-gui/main.rs"
required-features = ["gui"]

[dependencies]
sieve-rules = { path = "crates/sieve-rules" }
eframe = { version = "0.36", optional = true, default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11", "accesskit"] }
egui = { version = "0.36", optional = true }
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "0.8"
webpki-roots = "1"
mail-parser = "0.11.9"

[profile.release]
lto = true
strip = true
codegen-units = 1
