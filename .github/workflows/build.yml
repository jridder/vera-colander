name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  bin: sievectl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, bin: sievectl }
          - { os: macos-latest,   target: aarch64-apple-darwin,      bin: sievectl }
          - { os: macos-latest,   target: x86_64-apple-darwin,       bin: sievectl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    bin: sievectl.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a ../sievectl-${{ matrix.target }}.zip ${{ matrix.bin }}
          else
            tar czf ../sievectl-${{ matrix.target }}.tar.gz ${{ matrix.bin }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sievectl-${{ matrix.target }}
          path: sievectl-${{ matrix.target }}.*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sievectl-${{ matrix.target }}.*
