name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest,     target: aarch64-apple-darwin,      ext: "" }
          - { os: macos-latest,     target: x86_64-apple-darwin,       ext: "" }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux GUI build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir dist
          for b in sievectl sievectl-gui; do cp target/${{ matrix.target }}/release/$b${{ matrix.ext }} dist/; done
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a ../sievectl-${{ matrix.target }}.zip *
          else
            tar czf ../sievectl-${{ matrix.target }}.tar.gz *
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sievectl-${{ matrix.target }}
          path: sievectl-${{ matrix.target }}.*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sievectl-${{ matrix.target }}.*
